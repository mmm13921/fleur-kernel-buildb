name: Fleux GPU OC 1100MHz (AnyKernel3)
run-name: Fleux GPU OC 1100MHz

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-gpu1100.yml
      - scripts/build_gpu1100.sh
      - scripts/apply_gpu1100.sh
      - scripts/audit_gpu1100_image.py
      - scripts/anykernel_gpu1100.sh
      - docs/gpu1100-changelog.md
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fleux source branch or tag
        required: true
        default: lineage-24.0
        type: string

permissions:
  contents: write

concurrency:
  group: fleux-gpu1100-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'lineage-24.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ca-certificates curl flex git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev libssl-dev lld make python3 dwarves zip unzip
      - name: Install Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"
      - name: Build GPU OC 1100MHz
        run: bash scripts/build_gpu1100.sh "$SOURCE_REF"
      - name: Package AnyKernel3
        env:
          AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
        run: |
          set -euo pipefail
          AK_DIR="$RUNNER_TEMP/AnyKernel3"
          mkdir -p "$AK_DIR"
          git -C "$AK_DIR" init
          git -C "$AK_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          cp scripts/anykernel_gpu1100.sh "$AK_DIR/anykernel.sh"
          cp artifacts/Image.gz-dtb "$AK_DIR/Image.gz-dtb"
          cp docs/gpu1100-changelog.md "$AK_DIR/GPU-OC-CHANGELOG.txt"
          cp artifacts/kernel.config artifacts/build-manifest.txt artifacts/gpu1100-source.patch "$AK_DIR/"
          (cd "$AK_DIR" && zip -r9 "$GITHUB_WORKSPACE/artifacts/Fleux-GPU-OC-1100MHz-AnyKernel3.zip" META-INF tools LICENSE anykernel.sh Image.gz-dtb GPU-OC-CHANGELOG.txt kernel.config build-manifest.txt gpu1100-source.patch)
          unzip -t "$GITHUB_WORKSPACE/artifacts/Fleux-GPU-OC-1100MHz-AnyKernel3.zip"
          sha256sum artifacts/Fleux-GPU-OC-1100MHz-AnyKernel3.zip | tee artifacts/GPU-OC-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fleux-gpu-oc-1100mhz-anykernel3
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(artifacts/Fleux-GPU-OC-1100MHz-AnyKernel3.zip artifacts/Image.gz-dtb artifacts/kernel.config artifacts/build-manifest.txt artifacts/gpu1100-source.patch artifacts/GPU-OC-SHA256.txt)
          if gh release view gpu1100 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload gpu1100 "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit gpu1100 --repo "$GITHUB_REPOSITORY" --title "Fleux GPU OC 1100MHz — AnyKernel3" --notes-file docs/gpu1100-changelog.md
          else
            gh release create gpu1100 "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --title "Fleux GPU OC 1100MHz — AnyKernel3" --target "$GITHUB_SHA" --notes-file docs/gpu1100-changelog.md
          fi
