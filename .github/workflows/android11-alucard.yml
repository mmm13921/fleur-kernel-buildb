name: Fleur Android 11 Alucard Governor (4.14.343 test)

on:
  push:
    branches:
      - android11-governor-alucard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleur-android11-alucard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Fleur R-OSS with Alucard
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 zip unzip dwarves

      - name: Install checksum-verified Android Clang r563880c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"

      - name: Patch and build kernel
        run: bash scripts/build_android11_alucard.sh

      - name: Upload kernel image, AnyKernel3 ZIP and build audit
        uses: actions/upload-artifact@v4
        with:
          name: fleur-android11-alucard-4.14.343
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
