name: Fleur R-OSS EEVDF + OC2 2.2GHz
run-name: Fleur R-OSS EEVDF + OC2 2.2GHz (\${{ github.event_name }})

on:
  push:
    branches: [r-oss-eevdf-oc2-2200]
    paths:
      - .github/workflows/build-r-oss-eevdf-oc2.yml
      - scripts/apply_eevdf_r14.py
      - scripts/apply_r_oss_oc2_2200.py
      - scripts/audit_r_oss_oc2_image.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleur-r-oss-eevdf-oc2-2200
  cancel-in-progress: false

jobs:
  build:
    name: Build Fleur R-OSS 4.14.343 EEVDF + CPU OC2
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REPO: https://github.com/xiaomi-mt6781-fleur-dev/android_kernel_mt6781.git
      SOURCE_SHA: 29295d3eeaa5290732b52b5800a360e86c04301e
      SOURCE_REF: fleur-r-oss
      SRC_DIR: \${{ github.workspace }}/kernel-src
      OUT_DIR: \${{ github.workspace }}/out
      ARTIFACT_DIR: \${{ github.workspace }}/artifacts
      LOCALVERSION: -EEVDF-R-OC2-2200

    steps:
      - name: Check out build scripts
        uses: actions/checkout@v4

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libelf-dev \
            libssl-dev lld make python3 dwarves zip unzip

      - name: Install checksum-verified Android Clang r563880c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-r563880c"
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 60 -fL \
            "https://github.com/SA9990/Toolchain/releases/download/clang-r563880c/clang-r563880c.tar.gz" \
            -o "$RUNNER_TEMP/clang-r563880c.tar.gz"
          echo "57b456636aa9c3f5e159bc1dd6eddd7c6de654281cad84376e408a5d35f91bab  $RUNNER_TEMP/clang-r563880c.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/clang-r563880c.tar.gz" -C "$RUNNER_TEMP/clang-r563880c"
          test -x "$RUNNER_TEMP/clang-r563880c/bin/clang"
          echo "$RUNNER_TEMP/clang-r563880c/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/clang-r563880c" >> "$GITHUB_ENV"

      - name: Fetch pinned Fleur Android R OSS source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR"
          git -C "$SRC_DIR" init
          git -C "$SRC_DIR" remote add origin "$SOURCE_REPO"
          git -C "$SRC_DIR" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$SRC_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC_DIR" rev-parse HEAD)" = "$SOURCE_SHA"
          grep -q '^VERSION = 4$' "$SRC_DIR/Makefile"
          grep -q '^PATCHLEVEL = 14$' "$SRC_DIR/Makefile"
          grep -q '^SUBLEVEL = 343$' "$SRC_DIR/Makefile"
          test -s "$SRC_DIR/arch/arm64/configs/fleur_defconfig"
          test -s "$SRC_DIR/arch/arm64/boot/dts/mediatek/mt6781.dts"

          # KernelSU is disabled: this snapshot references an absent Kconfig file.
          sed -i '/^[[:space:]]*source "drivers\/kernelsu\/Kconfig"[[:space:]]*$/d' "$SRC_DIR/drivers/Kconfig"
          sed -i '/^CONFIG_KSU=y$/d; s/-KSU//g' "$SRC_DIR/arch/arm64/configs/fleur_defconfig"
          ! grep -q 'drivers/kernelsu/Kconfig' "$SRC_DIR/drivers/Kconfig"
          ! grep -q '^CONFIG_KSU=y$' "$SRC_DIR/arch/arm64/configs/fleur_defconfig"

      - name: Apply EEVDF scheduler prototype
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_eevdf_r14.py "$SRC_DIR"
          grep -q "pick_eevdf_entity" "$SRC_DIR/kernel/sched/fair.c"
          grep -q "deadline;" "$SRC_DIR/include/linux/sched.h"
          grep -q "walt.h" "$SRC_DIR/kernel/sched/fair.c"

      - name: Apply R-OSS CPU-only 2.2GHz OPP update
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_r_oss_oc2_2200.py "$SRC_DIR"
          git -C "$SRC_DIR" -c core.whitespace=cr-at-eol diff --check

      - name: Configure Fleur
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          make -C "$SRC_DIR" O="$OUT_DIR" ARCH=arm64 \
            fleur_defconfig CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          grep -q '^CONFIG_SCHED_WALT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_SCHED_HMP=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_SCHED_TUNE=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MACH_MT6781=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_MTK_CPU_FREQ=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_THERMAL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_CPU_THERMAL=y$' "$OUT_DIR/.config"
          ! grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"

      - name: Build Image.gz-dtb
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          make -C "$SRC_DIR" -j"$(nproc)" O="$OUT_DIR" ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION="$LOCALVERSION" Image.gz-dtb

          IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz-dtb"
          test -s "$IMAGE"
          mkdir -p "$ARTIFACT_DIR"
          cp "$IMAGE" "$ARTIFACT_DIR/Image.gz-dtb"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/kernel.config"
          python3 scripts/audit_r_oss_oc2_image.py "$ARTIFACT_DIR/Image.gz-dtb"
          git -C "$SRC_DIR" diff --binary > "$ARTIFACT_DIR/r-oss-eevdf-oc2-source.patch"

          {
            echo "device=fleur"
            echo "source_url=$SOURCE_REPO"
            echo "source_ref=$SOURCE_REF"
            echo "source_commit=$SOURCE_SHA"
            echo "android_base=Android R OSS"
            echo "kernel_version=4.14.343"
            echo "scheduler=EEVDF R14 prototype"
            echo "eevdf_selection=eligible entities + earliest virtual deadline"
            echo "eevdf_tree_selection=linear scan; not upstream augmented O(log n) tree"
            echo "vendor_scheduler=WALT,HMP,EAS,schedtune retained"
            echo "kernel_su=disabled"
            echo "cpu_oc=CPU6/CPU7 big-cluster only"
            echo "big_cluster_max_khz=2200000"
            echo "big_cluster_vproc_uv=1156250"
            echo "big_cluster_vproc_software_ceiling_uv=1156250"
            echo "big_cluster_vsram_software_ceiling_uv=1256250"
            echo "cci_gpu_little_cluster_oc=unchanged"
            echo "thermal_ppm_imax_watchdog=retained"
            echo "pmic_physical_regulator_limits=unchanged"
            echo "sspm_firmware=unchanged"
            echo "toolchain=Android Clang r563880c"
            echo "kernel_image=Image.gz-dtb"
            echo "flashable_zip=AnyKernel3"
            echo "build_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            sha256sum "$ARTIFACT_DIR/Image.gz-dtb" \
              "$ARTIFACT_DIR/kernel.config" \
              "$ARTIFACT_DIR/r-oss-eevdf-oc2-source.patch"
          } | tee "$ARTIFACT_DIR/build-manifest.txt"

      - name: Package flashable AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          AK3_DIR="$RUNNER_TEMP/AnyKernel3"
          AK3_COMMIT=41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          mkdir -p "$AK3_DIR"
          git -C "$AK3_DIR" init
          git -C "$AK3_DIR" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK3_DIR" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK3_DIR" checkout --detach FETCH_HEAD
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md"

          cp "$ARTIFACT_DIR/Image.gz-dtb" "$AK3_DIR/Image.gz-dtb"
          cp "$ARTIFACT_DIR/kernel.config" "$AK3_DIR/kernel.config"
          cp "$ARTIFACT_DIR/build-manifest.txt" "$AK3_DIR/build-manifest.txt"
          cp "$ARTIFACT_DIR/r-oss-eevdf-oc2-source.patch" "$AK3_DIR/r-oss-eevdf-oc2-source.patch"

          cat > "$AK3_DIR/anykernel.sh" <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Fleur R-OSS EEVDF OC2 2.2GHz
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fleur
          device.name2=miel
          supported.versions=11.0-14.0
          '; }

          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin
          }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh && attributes;
          dump_boot;
          write_boot;
          AK3

          printf '%s\n' \
            "Fleur R-OSS 4.14.343" \
            "EEVDF R14 prototype; WALT/HMP/EAS/schedtune retained" \
            "Big cluster CPU6/CPU7 2.2GHz; little/CCI/GPU unchanged" \
            "KernelSU disabled; thermal and PMIC safety limits retained" \
            > "$AK3_DIR/version"

          (
            cd "$AK3_DIR"
            zip -r9 "$ARTIFACT_DIR/Fleur-R-OSS-EEVDF-OC2-2.2GHz-AnyKernel3.zip" \
              META-INF tools LICENSE anykernel.sh Image.gz-dtb version \
              kernel.config build-manifest.txt r-oss-eevdf-oc2-source.patch
          )
          unzip -t "$ARTIFACT_DIR/Fleur-R-OSS-EEVDF-OC2-2.2GHz-AnyKernel3.zip"
          unzip -l "$ARTIFACT_DIR/Fleur-R-OSS-EEVDF-OC2-2.2GHz-AnyKernel3.zip" \
            | grep -E 'META-INF/com/google/android/update-binary|tools/ak3-core.sh|anykernel.sh|Image.gz-dtb|LICENSE'
          sha256sum "$ARTIFACT_DIR/Fleur-R-OSS-EEVDF-OC2-2.2GHz-AnyKernel3.zip" \
            | tee "$ARTIFACT_DIR/AnyKernel3-SHA256.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fleur-r-oss-eevdf-oc2-2200
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r-oss-eevdf-oc2-2200
          name: Fleur R-OSS EEVDF + OC2 2.2GHz (Experimental)
          target_commitish: \${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Experimental build for Redmi Note 11S 4G / POCO M4 Pro 4G (fleur).

            - Base: Android R OSS, Linux 4.14.343
            - Scheduler: EEVDF R14 prototype (linear scan; not upstream O(log n))
            - WALT, HMP, EAS and schedtune retained
            - CPU6/CPU7 big cluster: 2.2 GHz / 1.15625 V software target
            - Little cluster, CCI and GPU unchanged
            - KernelSU disabled
            - Thermal, PPM/IMAX, watchdog and PMIC hardware protections retained
            - DTB audit required CPU6/CPU7 2.2 GHz clocks and the 16-row DOE B-table

            Flash only after making a full backup of the current boot image. Build success does not prove MIUI 14 boot compatibility; this package is experimental.
          files: |
            artifacts/Fleur-R-OSS-EEVDF-OC2-2.2GHz-AnyKernel3.zip
            artifacts/Image.gz-dtb
            artifacts/kernel.config
            artifacts/build-manifest.txt
            artifacts/r-oss-eevdf-oc2-source.patch
            artifacts/AnyKernel3-SHA256.txt
          fail_on_unmatched_files: true
